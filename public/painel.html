<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Define a base dos caminhos (funciona em /tv/TOKEN, /painel, /login e também em /public/...)
    (function () {
      var p = location.pathname, i = p.indexOf('/tv/');
      var b = i >= 0 ? p.slice(0, i + 1) : p.replace(/[^\/]*$/, '');
      document.write('<base href="' + b + '">');
    })();
  </script>
  <title>Controle da Vitrine</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/steak.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/180/steak.png">
</head>
<body class="body-painel">

  <div class="controle-remoto" id="app" style="display:none">
    <div class="topo-controle">
      <div class="status-box">
        <span class="status-dot"></span>
        <span class="status-texto" id="nome-loja">VITRINE CONECTADA</span>
      </div>
      <button class="btn-sair" id="btn-sair">Sair</button>
    </div>

    <!-- Link da TV -->
    <div class="bloco-controle">
      <span class="label-controle">LINK DA SUA TV</span>
      <div class="link-tv-box">
        <span id="link-tv" class="link-tv"></span>
        <button class="btn-copiar" id="btn-copiar">Copiar</button>
      </div>
    </div>

    <!-- 1. Categoria -->
    <div class="bloco-controle">
      <span class="label-controle">1. CATEGORIA</span>
      <div class="selector-grid grid-4" id="grid-animais"></div>
    </div>

    <!-- 2. Corte -->
    <div class="bloco-controle">
      <span class="label-controle">2. CORTE</span>
      <div class="selector-grid grid-cortes" id="grid-cortes"></div>
    </div>

    <!-- 3. Preço -->
    <div class="bloco-controle">
      <span class="label-controle" id="label-preco">3. PREÇO (R$ / KG)</span>
      <div class="display-preco-input">
        <span class="cifra-input">R$</span>
        <input type="text" id="input-preco" placeholder="0,00" inputmode="numeric">
      </div>
    </div>

    <button class="btn-disparar" id="btn-transmitir">TRANSMITIR PARA TV</button>

    <div class="bloco-controle bloco-historico">
      <span class="label-controle">OFERTAS ATIVAS NA TV</span>
      <div id="lista-historico" class="lista-historico"></div>
    </div>
  </div>

  <div id="aviso-sem-loja" class="controle-remoto" style="display:none">
    <p class="sem-itens">Sua conta ainda não está ligada a um açougue. Fale com o suporte.</p>
    <button class="btn-sair" id="btn-sair-2">Sair</button>
  </div>

  <script type="module">
    import { supabase } from './config.js';
    import { CATALOGO, UNIDADES } from './catalogo.js';

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) location.replace('login');

    async function sair() {
      await supabase.auth.signOut();
      location.replace('login');
    }
    document.getElementById('btn-sair').addEventListener('click', sair);
    document.getElementById('btn-sair-2').addEventListener('click', sair);

    // A regra de segurança do banco só devolve a loja do próprio usuário
    const { data: loja } = await supabase
      .from('lojas')
      .select('id, nome, tv_token')
      .maybeSingle();

    if (!loja) {
      document.getElementById('aviso-sem-loja').style.display = 'flex';
      throw new Error('Usuário sem loja');
    }

    document.getElementById('app').style.display = 'flex';
    document.getElementById('nome-loja').textContent = loja.nome.toUpperCase();

    const linkTv = new URL(`tv/${loja.tv_token}`, document.baseURI).href;
    document.getElementById('link-tv').textContent = linkTv;
    document.getElementById('btn-copiar').addEventListener('click', async (e) => {
      try {
        await navigator.clipboard.writeText(linkTv);
        e.target.textContent = 'Copiado!';
      } catch {
        prompt('Copie o link da TV:', linkTv);
      }
      setTimeout(() => (e.target.textContent = 'Copiar'), 2000);
    });

    let animalAtual = 'boi';
    let corteAtual = CATALOGO.boi.itens[0];

    // Vírgula automática enquanto digita
    const inputPreco = document.getElementById('input-preco');
    inputPreco.addEventListener('input', () => {
      const valor = inputPreco.value.replace(/\D/g, "");
      if (!valor) { inputPreco.value = ""; return; }
      inputPreco.value = (parseInt(valor, 10) / 100).toFixed(2).replace(".", ",");
    });

    function atualizarLabelPreco() {
      document.getElementById('label-preco').textContent =
        `3. PREÇO (R$ / ${UNIDADES[corteAtual.unidade].label})`;
    }

    const gridAnimais = document.getElementById('grid-animais');
    Object.entries(CATALOGO).forEach(([chave, cat], idx) => {
      const btn = document.createElement('button');
      btn.className = `btn-pilula ${idx === 0 ? 'active' : ''}`;
      btn.textContent = cat.label;
      btn.addEventListener('click', () => {
        animalAtual = chave;
        gridAnimais.querySelectorAll('.btn-pilula').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        carregarCortes();
      });
      gridAnimais.appendChild(btn);
    });

    function carregarCortes() {
      const container = document.getElementById('grid-cortes');
      container.innerHTML = '';
      const itens = CATALOGO[animalAtual].itens;
      corteAtual = itens[0];
      atualizarLabelPreco();

      itens.forEach((c, index) => {
        const btn = document.createElement('button');
        btn.className = `btn-corte ${index === 0 ? 'active' : ''}`;
        const img = document.createElement('img');
        img.src = `assets/carnes/${c.arquivo}`;
        img.alt = '';
        img.loading = 'lazy';
        img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
        const nome = document.createElement('span');
        nome.textContent = c.nome;
        btn.append(img, nome);
        btn.addEventListener('click', () => {
          container.querySelectorAll('.btn-corte').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          corteAtual = c;
          atualizarLabelPreco();
        });
        container.appendChild(btn);
      });
    }

    document.getElementById('btn-transmitir').addEventListener('click', async () => {
      const precoFormatado = inputPreco.value.trim();
      if (!precoFormatado) { alert('Digite o preço da carne!'); return; }

      const precoNum = parseFloat(precoFormatado.replace(',', '.'));
      if (isNaN(precoNum) || precoNum <= 0) {
        alert('Digite um número válido maior que zero!');
        return;
      }

      const un = UNIDADES[corteAtual.unidade];
      if (precoNum > un.max) {
        if (!confirm(`ATENÇÃO!\n\nR$ ${precoFormatado} é um preço MUITO ALTO para ${un.label} de ${corteAtual.nome}.\n\nConfirmar este valor na TV?`)) return;
      } else if (precoNum < un.min) {
        if (!confirm(`ATENÇÃO!\n\nR$ ${precoFormatado} é um preço MUITO BAIXO para ${un.label} de ${corteAtual.nome}.\n\nConfirmar este valor na TV?`)) return;
      }

      const { error } = await supabase.from('ofertas').insert({
        loja_id: loja.id,
        animal: animalAtual,
        corte: corteAtual.nome,
        carne: corteAtual.arquivo,
        preco: precoNum,
        unidade: corteAtual.unidade
      });

      if (error) { alert('Não foi possível enviar. Tente novamente.'); return; }
      inputPreco.value = '';
      listarOfertas();
    });

    async function listarOfertas() {
      const container = document.getElementById('lista-historico');
      const { data, error } = await supabase
        .from('ofertas')
        .select('id, corte, preco, unidade')
        .eq('loja_id', loja.id)
        .eq('ativo', true)
        .order('updated_at', { ascending: true });

      container.innerHTML = '';
      if (error || !data || data.length === 0) {
        container.innerHTML = '<p class="sem-itens">Nenhuma oferta transmitida</p>';
        return;
      }

      data.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'item-historico';

        const info = document.createElement('div');
        const nome = document.createElement('strong');
        nome.textContent = item.corte;
        const preco = document.createElement('span');
        preco.className = 'preco-tag';
        preco.textContent = `R$ ${Number(item.preco).toFixed(2).replace('.', ',')} / ${(UNIDADES[item.unidade] || UNIDADES.kg).label}`;
        info.append(nome, preco);

        const btn = document.createElement('button');
        btn.className = 'btn-excluir';
        btn.textContent = '✕';
        btn.addEventListener('click', async () => {
          await supabase.from('ofertas').delete().eq('id', item.id);
          listarOfertas();
        });

        card.append(info, btn);
        container.appendChild(card);
      });
    }

    carregarCortes();
    listarOfertas();
  </script>
</body>
</html>
